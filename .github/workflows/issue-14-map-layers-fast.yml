name: Issue 14 map display layers fast
on:
  push:
    branches:
      - codex/issue-14-map-layer-toggles
    paths:
      - 'poc/v2/**'
      - '.github/workflows/issue-14-map-layers-fast.yml'
  workflow_dispatch:
concurrency:
  group: issue-14-map-layers-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: UI and simulation syntax
        working-directory: poc/v2
        run: |
          node --check src/app.js
          node --check src/politics.js
          node --check tests/map-layers.test.cjs
      - name: Layer UI and P2 safety contracts
        working-directory: poc/v2
        run: timeout 60s node --test tests/map-layers.test.cjs tests/layout.test.cjs tests/quarry-p2.test.cjs
      - name: Existing mobility and political regressions
        working-directory: poc/v2
        run: timeout 50s node --test tests/mobility-contact-fast.test.cjs tests/polity-command.test.cjs tests/diplomacy.test.cjs
      - name: Smoke
        working-directory: poc/v2
        run: timeout 20s npm run smoke
      - name: Offline playable synchronization
        working-directory: poc/v2
        run: timeout 20s npm run check:playable
