name: Issue 15 P1a P2a Village Art Fast
on:
  push:
    branches:
      - codex/issue-15-village-art-p1a-p2a
    paths:
      - 'poc/v2/**'
      - '.github/workflows/issue-15-village-art-fast.yml'
  workflow_dispatch:
concurrency:
  group: issue-15-village-art-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pixel-village:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate real PNG bytes, renderer and true-world village
        working-directory: poc/v2
        run: |
          node --check src/village-pixel-art.js
          node --check src/app.js
          timeout 55s node --test tests/pixel-village-art.test.cjs tests/character-art.test.cjs tests/closeup-p0.test.cjs
      - name: Regress real crowd, map, aim and combat
        working-directory: poc/v2
        run: timeout 55s node --test tests/crowd-selection.test.cjs tests/living-world.test.cjs tests/need-location.test.cjs tests/miracle-parameters.test.cjs tests/map-layers.test.cjs tests/polity-intervention-ui.test.cjs tests/layout.test.cjs
      - name: Smoke / offline PNG inline parity
        working-directory: poc/v2
        run: |
          timeout 20s npm run smoke
          timeout 20s npm run check:playable
      - name: Capture the genuine native-world 8x village screenshot
        working-directory: poc/v2
        run: |
          set -euo pipefail
          mkdir -p reports
          node tools/serve.cjs >/tmp/wog-local.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/village-review.html >/dev/null; then break; fi
            sleep .2
          done
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium browser installed; cannot assert an actual-browser screenshot'
            exit 1
          fi
          timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --hide-scrollbars --window-size=1550,940 \
            --virtual-time-budget=8000 --screenshot="reports/native-village-8x.png" \
            http://127.0.0.1:8000/village-review.html
          test -s reports/native-village-8x.png
          node -e "const fs=require('fs');const b=fs.readFileSync('reports/native-village-8x.png');if(b.toString('hex',0,8)!=='89504e470d0a1a0a'||b.readUInt32BE(16)<1000)process.exit(1);console.log('Chromium screenshot: '+b.length+' bytes, '+b.readUInt32BE(16)+'x'+b.readUInt32BE(20))"
      - uses: actions/upload-artifact@v6
        with:
          name: issue-15-native-village-8x
          path: poc/v2/reports/native-village-8x.png
          retention-days: 14
