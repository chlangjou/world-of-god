name: World of God fast regression
on:
  push:
    branches:
      - main
      - feature/opponent-difficulty-profiles-v0.3
      - feature/shrine-temple-web-poc-v0.1
      - feature/victory-dominance-playable-v0.1
      - feature/autonomous-frontier-playable-v0.2
      - feature/oracle-direct-switch-multigod-foundation-v0.1
      - codex/oracle-playable-ci
    paths:
      - 'poc/v2/**'
      - '.github/workflows/mobility-fast.yml'
  workflow_dispatch:

# A rapid series of commits should not run multiple obsolete regressions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  movement-and-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax
        working-directory: poc/v2
        run: |
          node --check src/mobility.js
          node --check src/shrine-temple.js
          node --check src/victory.js
          node --check src/sim.js
          node --check src/app.js
          node --check src/playtest.js
          node --check tests/oracle-miracle-pairing.test.cjs
          node --check tests/multigod.test.cjs
      - name: Fast physical contact, injury, Heal and Oracle matrix tests
        working-directory: poc/v2
        run: npm run test:fast
      - name: Build offline standalone
        working-directory: poc/v2
        run: |
          npm run build:standalone
          grep -q 'window.WOG_MOBILITY_PROFILE' dist/World-of-God-PoC-v2.html
          grep -q 'window.WOG_SHRINE_PROFILE' dist/World-of-God-PoC-v2.html
          grep -q 'WoGMobility' dist/World-of-God-PoC-v2.html
          grep -q 'WoGTemple' dist/World-of-God-PoC-v2.html
          grep -q 'WoGVictory' dist/World-of-God-PoC-v2.html
          grep -q 'WOG_VICTORY_PROFILE' dist/World-of-God-PoC-v2.html
      # Source files are often committed before the downloadable HTML during
      # feature development. Verify the checked-in release bundle on main or
      # explicitly with workflow_dispatch, not on every intermediate push.
      - name: Verify committed playable bundle (release gate)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/victory-dominance-playable-v0.1' || github.ref == 'refs/heads/feature/autonomous-frontier-playable-v0.2' || github.ref == 'refs/heads/feature/oracle-direct-switch-multigod-foundation-v0.1' || github.ref == 'refs/heads/codex/oracle-playable-ci' || github.event_name == 'workflow_dispatch'
        working-directory: poc/v2
        run: npm run check:playable
