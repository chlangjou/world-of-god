name: Oracle specialization regression

on:
  push:
    branches:
      - feature/opponent-difficulty-profiles-v0.3
    paths:
      - 'poc/v2/**'
      - '.github/workflows/oracle-specialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        working-directory: poc/v2
        run: |
          node --check src/sim.js
          node --check src/app.js
          node --check tools/oracle-strategy-quick.cjs
          node --check tools/oracle-faith-defense-matrix.cjs
          node --check tools/oracle-30-core-ratio-sweep.cjs
          node --check tools/oracle-core30-cadence-loss-sweep.cjs
      - name: Compare full test suite with the unmodified parent baseline
        working-directory: poc/v2
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/wog-before-oracle"
          git worktree add --detach "$BASE_DIR" f40b882ea97d10a3d63fa93f10ff210875a8630d >/dev/null
          set +e
          (cd "$BASE_DIR/poc/v2" && node --test tests/native-world.test.cjs tests/religion.test.cjs) >"$RUNNER_TEMP/wog-baseline-tests.txt" 2>&1
          npm test >"$RUNNER_TEMP/wog-current-tests.txt" 2>&1
          set -e
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const dir=process.env.RUNNER_TEMP;
          const base=fs.readFileSync(path.join(dir,'wog-baseline-tests.txt'),'utf8');
          const current=fs.readFileSync(path.join(dir,'wog-current-tests.txt'),'utf8');
          const fails=s=>[...s.matchAll(/^not ok \d+ - (.+)$/gm)].map(x=>x[1]).sort();
          const b=fails(base),c=fails(current);
          // The old tests have two already failing assertions unrelated to
          // specialization (35-day AI spell count and NaN/null restore equality).
          assert.deepEqual(b,[
            'new settled community forms own Priest; Oracle arrives through a social/clerical relay',
            'separated origin settlements form autonomously and never share household membership'
          ].sort(),'Baseline changed: review accepted failures before continuing');
          assert.deepEqual(c,b,'New regression: failures differ from the baseline');
          const total=Number(current.match(/^# tests (\d+)$/m)?.[1]||0);
          assert.ok(total>=149,'Full suite must still run with added Oracle tests');
          console.log('Full suite:',total,'tests;',c.length,'pre-existing failures;',total-c.length,'pass');
          console.log('Pre-existing failures reproduced on unmodified f40b882:');
          for(const name of c)console.log('- '+name);
          JS
      - name: Build standalone browser artifact
        working-directory: poc/v2
        run: npm run build:standalone
      - name: Run bounded five-arm strategy check
        working-directory: poc/v2
        run: npm run evaluate:oracle -- --days 60 --budget-ms 30000 --out reports/oracle-strategy-quick-2026-10-13.json
      - name: Assert genuine strategy outcomes, not mere 20+ affiliation fluctuation
        working-directory: poc/v2
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./reports/oracle-strategy-quick-2026-10-13.json');
          assert.equal(r.forkDay,45);
          assert.equal(r.afterDays,60);
          assert.equal(r.cases.length,5);
          const by=Object.fromEntries(r.cases.map(x=>[x.arm,x]));
          for(const item of r.cases){
            assert.ok(item.checkpoints.every(x=>x.valid),item.arm);
            assert.ok(item.actions.every(x=>x.ok),item.arm);
          }
          const end=name=>by[name].checkpoints.at(-1);
          assert.equal(end('passive').originalAIbelow40,0);
          assert.ok(end('nurture').originalAIbelow40>end('passive').originalAIbelow40);
          assert.ok(end('reserve').food>end('passive').food);
          assert.ok(by['nurture-reset-reserve'].actions.some(a=>a.intent==='life.balance'&&a.ok));
          console.log('Oracle strategy assertions pass',r.identicalSnapshotFingerprint);
          JS
      - name: Eight-arm faith defense matchup evaluation
        working-directory: poc/v2
        run: npm run evaluate:oracle:matrix -- --days 60 --budget-ms 30000 --out reports/oracle-faith-defense-matrix-2026-10-14.json
      - name: Assert strategy matrix makes progress only through real world outcomes
        working-directory: poc/v2
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./reports/oracle-faith-defense-matrix-2026-10-14.json');
          assert.equal(r.forkDay,45);
          assert.equal(r.days,60);
          assert.equal(r.cases.length,8);
          const by=Object.fromEntries(r.cases.map(c=>[c.name,c]));
          for(const c of r.cases){
            assert.ok(c.checkpointResults.every(p=>p.valid),c.name);
            assert.ok(c.actions.every(a=>a.ok),c.name);
          }
          const end=name=>by[name].checkpointResults.at(-1);
          assert.equal(end('passive').originalAIeverBelow40,0);
          assert.equal(end('same-food').originalAIeverBelow40,0);
          assert.ok(end('nurture-v-food:proposed').originalAIeverBelow40>
            end('nurture-v-food:neutral').originalAIeverBelow40);
          assert.ok(end('nurture-v-food:proposed').playerEvidenceDoubts>0);
          assert.equal(end('food-v-explore').originalAIeverBelow40,0,
            'No artificial starving target may be created');
          assert.equal(end('explore-v-nurture').originalAIeverBelow40,0,
            'No artificial housing need may be created');
          console.log('Faith defense matrix: bounded real-world core changes verified');
          JS
      - name: Cross-seed short comparisons
        working-directory: poc/v2
        run: |
          set -e
          npm run evaluate:oracle:matrix -- --seed opponent-competition-replay --days 60 --only nurture-v-food:neutral,nurture-v-food:proposed --out reports/oracle-matrix-seed-b.json > /dev/null
          npm run evaluate:oracle:matrix -- --seed valley-spring-01 --days 60 --only nurture-v-food:neutral,nurture-v-food:proposed --out reports/oracle-matrix-seed-c.json > /dev/null
          node - <<'JS'
          const assert=require('node:assert/strict');
          for(const name of ['b','c']){
            const r=require('./reports/oracle-matrix-seed-'+name+'.json');
            assert.equal(r.cases.length,2);
            assert.ok(r.cases.every(c=>c.checkpointResults.every(p=>p.valid)));
            assert.equal(r.cases[0].name,'nurture-v-food:neutral');
            assert.equal(r.cases[1].name,'nurture-v-food:proposed');
            console.log(name,r.cases.map(c=>({
              mode:c.defenseMode,coreEverBelow40:c.checkpointResults.at(-1).originalAIeverBelow40,
              naturalConverted:c.checkpointResults.at(-1).originalAIConverted
            })));
          }
          JS
      - name: Sweep 30 Devotion-60 core citizens for exactly 100 days
        working-directory: poc/v2
        run: npm run evaluate:oracle:core30 -- --days 100 --budget-ms 15000 --out reports/oracle-30-core-ratio-sweep-2026-10-14.json > /dev/null
      - name: Verify controlled core trajectory and unsaturated ratios
        working-directory: poc/v2
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const r=require('./reports/oracle-30-core-ratio-sweep-2026-10-14.json');
          assert.equal(r.initialPeople,30);
          assert.equal(r.runDays,100);
          assert.equal(r.cases.length,6);
          assert.deepEqual(r.initialCore40,{player:15,AI:15});
          const by=Object.fromEntries(r.cases.map(c=>[c.name,c]));
          for(const c of r.cases){
            assert.ok(c.oracleIssued.every(Boolean),c.name);
            assert.equal(c.checkpoints.at(-1).elapsed,100);
            assert.ok(c.checkpoints.every(cp=>cp.valid&&cp.population===30),c.name);
            assert.ok(c.checkpoints.at(-1).contact.eligible>0,c.name);
            assert.ok(c.cohort.every(p=>p.initial===60),c.name);
          }
          const sweep=require('./tools/oracle-30-core-ratio-sweep.cjs');
          // FNV on JSON can differ across V8 runtimes. Rebuild the exact
          // fixture using the SAME Node executable rather than hardcoding
          // a hash obtained from a separate JavaScript isolate.
          const ownFingerprint=sweep.hash(JSON.stringify(sweep.fixture()));
          assert.equal(r.forkFingerprint,ownFingerprint);
          assert.ok(by['5.5:0.20'].eligibleContactProbability.foodDefender>
            by['1.6:0.4'].eligibleContactProbability.foodDefender);
          assert.ok(by['5.5:0.20'].eligibleContactProbability.nurtureDefender<
            by['1.6:0.4'].eligibleContactProbability.nurtureDefender);
          assert.ok(by['neutral-1:1'].outcome.AIeverBelow40>0,
            'even 1:1 can cross 40 with earned repeated contact');
          console.log('100-day / 30 core diagnostic sweep validated',r.forkFingerprint);
          JS

      - name: Run bounded 26-arm loss and contact cadence sweep
        working-directory: poc/v2
        run: npm run evaluate:oracle:cadence -- --budget-ms 12000 --out reports/oracle-core30-cadence-loss-sweep-2026-10-14.json > /dev/null
      - name: Verify same world and consistent per-person repeat windows
        working-directory: poc/v2
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const sweep=require('./tools/oracle-core30-cadence-loss-sweep.cjs');
          const data=require('./reports/oracle-core30-cadence-loss-sweep-2026-10-14.json');
          assert.equal(data.days,100);
          assert.deepEqual(data.originalCore,{player:15,AI:15});
          assert.equal(data.cases.length,26);
          assert.equal(data.startCohort.length,30);
          assert.ok(data.startCohort.every(x=>x[2]===60));
          assert.equal(data.fingerprint,sweep.stamp(JSON.stringify(sweep.prepare())),
            'Save checksum is checked in the same Node runtime');
          const by=Object.fromEntries(data.cases.map(c=>[c.name,c]));
          assert.ok(by['legacy-8pt-10d']);
          assert.ok(by['5pt-14d']);
          assert.ok(by['8pt-10d']);
          for(const c of data.cases){
            assert.equal(c.checkpoints[0].elapsedDays,0);
            assert.equal(c.checkpoints.at(-1).elapsedDays,100);
            assert.ok(c.checkpoints.every(t=>t.valid));
            assert.equal(c.originalCohort.length,30);
            assert.ok(c.originalCohort.every(x=>x.initialDevotion===60));
            assert.ok(c.issued.player&&c.issued.AI);
            if(c.followupUsesSameInterval){
              assert.equal(c.summary.invalidGaps,0,c.name);
              for(const person of c.eventTraces){
                for(let j=1;j<person.events.length;j++)
                  assert.ok(person.events[j].hour-person.events[j-1].hour >= c.repeatDays*24,
                    'Credited encounters too close '+c.name+' '+person.personId);
              }
            }
          }
          assert.equal(by['5pt-10d'].summary.AIeverBelow40,
            by['5pt-14d'].summary.AIeverBelow40);
          assert.ok(by['5pt-14d'].summary.AIeverBelow40>0);
          assert.equal(by['5pt-14d'].summary.AIconverted,0);
          assert.equal(by['5pt-14d'].oracleStopped.AI,null);
          assert.ok(by['legacy-8pt-10d'].summary.AIeverBelow40>
            by['5pt-14d'].summary.AIeverBelow40);
          console.log('Cadence/loss sweep validated:',data.cases.length,
            'arms from one identical 15:15 core world');
          JS
