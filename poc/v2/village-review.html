<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>World of God — 真實自然村落畫風驗收</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#101e21;color:#e7e5d7;font:13px system-ui}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;
  background:#162c2b;min-height:32px;border-bottom:1px solid #537067}
strong{color:#f1dab1}.status{color:#9fcbad}
iframe{border:0;display:block;width:100%;height:calc(100vh - 46px);min-height:560px}
</style></head>
<body>
<header>
 <div><strong>Living World · 真人／真實自然世界近景畫風驗收</strong>
  <span>　原生 Seed 世界、已存在房屋與地形，非預繪劇情</span></div>
 <span id="status" class="status">正在載入一般遊戲…</span>
</header>
<iframe id="game" src="index.html" title="完整可互動的正常世界近景遊戲"></iframe>
<script>
'use strict';
const frame=document.getElementById('game'),status=document.getElementById('status');
let stage=0,checks=0;
const monitor=setInterval(()=>{
  checks++;
  try{
    const w=frame.contentWindow,d=w.document;
    const ready=d.getElementById('resetBtn');
    if(!ready||ready.disabled)return;
    const selector=d.getElementById('playtestScenario');
    if(stage===0){
      if(selector.value!=='native'){
        w.confirm=()=>true;
        selector.value='native';
        selector.dispatchEvent(new w.Event('change',{bubbles:true}));
      }
      stage=1;return;
    }
    if(stage===1){
      const button=d.getElementById('villageArtBtn');
      if(!button||button.disabled)return;
      button.click();stage=2;
      status.textContent='自然世界 · 真實已建住屋 · 8× 近景';
      d.body.dataset.villageReview='ready';
      clearInterval(monitor);
    }
  }catch(e){status.textContent='檢視器錯誤：'+e.message;clearInterval(monitor);}
  if(checks>90){status.textContent='載入逾時：請直接打開 index.html，選自然河谷後按「村落近景」';clearInterval(monitor);}
},120);
</script>
</body></html>
